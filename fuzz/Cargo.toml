edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wincode = "0.5"
solana-sdk = "4.0.1"
kora-lib = { path = "../crates/lib" }

[[bin]]
name = "parse_transaction"
