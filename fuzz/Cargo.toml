[package]
name = "kora-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wincode = "0.5"
solana-sdk = "4.0.1"
kora-lib = { path = "../crates/lib" }

[dev-dependencies]
base64 = "0.22.1"
bincode = "1.3.3"
serde = "1.0"
solana-address-lookup-table-interface = { version = "3.0.0", features = ["serde"] }
solana-loader-v3-interface = { version = "6.1.0", features = ["serde"] }
solana-loader-v4-interface = { version = "3.1.0", features = ["serde"] }
solana-system-interface = { version = "2.0.0", features = ["serde"] }
spl-token-2022-interface = "2.1.0"
spl-token-interface = "3.0.0"
spl-token-metadata-interface = "0.8.0"

[[bin]]
name = "parse_transaction"
path = "fuzz_targets/parse_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_b64_transaction"
path = "fuzz_targets/decode_b64_transaction.rs"
test = false
doc = false
bench = false

[workspace]
