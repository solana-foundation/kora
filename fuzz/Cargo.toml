[package]
name = "kora-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }
wincode = "0.5"
base64 = "0.22.1"
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt"] }
solana-sdk = "4.0.1"
solana-client = "4.2.1"
solana-rpc-client = "4.2.1"
solana-message = ">=4.4.0,<4.5"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
solana-address-lookup-table-interface = { version = "3.0.0", features = ["bincode"] }
solana-loader-v3-interface = { version = "6.1.0", features = ["bincode"] }
solana-loader-v4-interface = { version = "3.1.0", features = ["bincode"] }
spl-token-interface = "3.0.0"
spl-token-2022-interface = "3.1.1"
spl-associated-token-account-interface = "2.0.0"
kora-lib = { path = "../crates/lib" }
litesvm = "0.16.0"
async-trait = "0.1"
bs58 = "0.5.1"
solana-nonce = { version = "3.2.0", features = ["wincode"] }
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"

[dev-dependencies]
bincode = "1.3.3"
serde = "1.0"
solana-address-lookup-table-interface = { version = "3.0.0", features = ["serde"] }
solana-loader-v3-interface = { version = "6.1.0", features = ["serde"] }
solana-loader-v4-interface = { version = "3.1.0", features = ["serde"] }
solana-system-interface = { version = "2.0.0", features = ["serde"] }
spl-token-metadata-interface = "1.0.1"

[[bin]]
name = "parse_transaction"
path = "fuzz_targets/parse_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_b64_transaction"
path = "fuzz_targets/decode_b64_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_transaction"
path = "fuzz_targets/validate_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential_litesvm"
path = "fuzz_targets/differential_litesvm.rs"
test = false
doc = false
bench = false

[workspace]
