[dev-dependencies]
# 1.6.1 is the floor: bundle execution is isolated from concurrent airdrops only since
# solana-foundation/surfpool#817 and #824, and simulateTransaction reports
# loadedAccountsDataSize the way a validator counts it only since #831. Without the first,
# a bundle commit reverts writes that landed while it ran; without the second, v1
# transactions sized from simulation exceed the loaded-accounts cap.
surfpool-sdk = "1.6.1"
