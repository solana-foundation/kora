[dev-dependencies]
# Fork of solana-foundation/surfpool@30242a4. It holds the svm write lock across
# a jito bundle's sandbox-and-commit, without which a commit reverts any write
# that landed while the bundle ran, and stops the sandbox inheriting the
# confirmation queue, without which a commit re-queues every in-flight
# transaction. Upstream has both as https://github.com/solana-foundation/surfpool/pull/804
# and is not expected to merge it, so this fork is the long-term source.
surfpool-sdk = { git = "https://github.com/dev-jodee/surfpool", rev = "207030e09c6b46789157765077ad85a5b6cc3897" }
