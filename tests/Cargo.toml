[dev-dependencies]
# Pinned to a commit rather than the 1.6.0 release: bundle execution only became
# isolated from concurrent airdrops in solana-foundation/surfpool#817 and #824, both
# merged after that release. Without them a bundle commit reverts any write that
# landed while the bundle ran, which the bundle phases hit through create_funded_wallet.
surfpool-sdk = { git = "https://github.com/solana-foundation/surfpool", rev = "72ea220c0ea812892209df4ae2db76a23ef7112f" }
