[workspace]

[package]
name = "transfer-hook-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_hook_example"

[features]
no-entrypoint = []
default = []

[dependencies]
solana-program = "3.0"
solana-system-interface = { version = "2.0", features = ["bincode"] }
spl-transfer-hook-interface = "2.1"
spl-tlv-account-resolution = "0.11"
