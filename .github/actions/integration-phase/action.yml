name: "Integration phase"
description: "Run one prebuilt integration test binary against a prebuilt Kora binary"

inputs:
  test-target:
    description: "The [[test]] target in tests/ to run"
    required: true
  artifact-name:
    description: "Artifact holding the prebuilt Kora binary"
    required: true
  setup-node:
    description: "Install Node and the TypeScript SDK dependencies, for targets that shell out to jest"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: target/

    - name: Make binaries executable
      shell: bash
      run: chmod +x target/debug/kora target/test-bins/*

    - name: Setup Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: "lts/*"

    - name: Setup pnpm
      if: inputs.setup-node == 'true'
      uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
      with:
        version: 11.28.2
        run_install: false

    - name: Get pnpm store directory
      if: inputs.setup-node == 'true'
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      if: inputs.setup-node == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('sdks/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-store-

    - name: Install TypeScript dependencies
      if: inputs.setup-node == 'true'
      shell: bash
      working-directory: sdks/ts
      run: pnpm install --frozen-lockfile

    - name: Run integration tests
      shell: bash
      working-directory: tests
      env:
        KORA_TEST_VERBOSE: "1"
      run: ../target/test-bins/${{ inputs.test-target }}
