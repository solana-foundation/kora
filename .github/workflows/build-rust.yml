name: Build Rust Artifacts

on:
  workflow_call:
    inputs:
      cache-key:
        description: "Cache key suffix for rust cache"
        required: true
        type: string
      artifact-name:
        description: "Base name for the uploaded artifact"
        required: true
        type: string
    outputs:
      artifact-name:
        description: "The actual artifact name with hash suffix"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Rust Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ inputs.artifact-name }}-${{ steps.source-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ inputs.cache-key }}

      - name: Calculate source files hash
        id: source-hash
        run: |
          SOURCE_HASH=$(find crates tests Cargo.toml Cargo.lock justfile -type f \( -name "*.rs" -o -name "*.toml" -o -name "justfile" \) -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1 | head -c 8)
          echo "hash=$SOURCE_HASH" >> $GITHUB_OUTPUT
          echo "Source files hash: $SOURCE_HASH"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.50.0"

      - name: Build workspace
        run: just build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}-${{ steps.source-hash.outputs.hash }}
          path: |
            target/debug/kora
            target/debug/test_runner
          retention-days: 1
