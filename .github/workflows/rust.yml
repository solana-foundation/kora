name: Rust Integration Tests

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tests/**"
      - "sdks/ts/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/rust.yml"
      - ".github/workflows/build-rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "tests/**"
      - "sdks/ts/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/rust.yml"
      - ".github/workflows/build-rust.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  CI: true

jobs:
  build:
    name: Build Artifacts
    uses: ./.github/workflows/build-rust.yml
    with:
      cache-key: "rust-dev"
      artifact-name: "rust-binaries"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # external excluded: hits live Jupiter API
        test-target:
          [
            rpc,
            tokens,
            adversarial,
            auth,
            payment_address,
            multi_signer,
            fee_payer_policy,
            free_signing,
            lighthouse,
            loader_v3_deploy,
            usage_limit,
            typescript_basic,
            typescript_auth,
            typescript_free,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-07-13

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "rust-dev"
          save-if: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: target/debug/

      - name: Make binaries executable
        run: chmod +x target/debug/kora

      - name: Fetch Doppler secrets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_SERVICE_IDENTITY_ID }}
          doppler-project: ${{ vars.DOPPLER_PROJECT || 'kora' }}
          doppler-config: ${{ vars.DOPPLER_CONFIG_CI || 'stg_github' }}
          inject-env-vars: true

      # The typescript flavors shell out to jest, so they alone need node.
      - name: Setup Node.js
        if: startsWith(matrix.test-target, 'typescript')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        if: startsWith(matrix.test-target, 'typescript')
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
        with:
          version: 11.13.0
          run_install: false

      - name: Get pnpm store directory
        if: startsWith(matrix.test-target, 'typescript')
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: startsWith(matrix.test-target, 'typescript')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('sdks/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install TypeScript dependencies
        if: startsWith(matrix.test-target, 'typescript')
        working-directory: sdks/ts
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        env:
          KORA_TEST_VERBOSE: "1"
        run: cargo test -p tests --test ${{ matrix.test-target }}

      - name: Cleanup test environment
        if: always()
        uses: ./.github/actions/cleanup-test-env

