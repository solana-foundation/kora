name: TypeScript Integration Tests

# Routine CI runs these three flavors inside the rust.yml matrix, which already
# has the build artifact, so this workflow exists only for the publish gate and
# manual runs. Keeping the triggers off avoids a second Build Artifacts job on
# every pull request.
on:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  CI: true

jobs:
  build:
    name: Build Artifacts
    uses: ./.github/workflows/build-rust.yml
    with:
      cache-key: "rust-dev"
      artifact-name: "rust-binaries-ts"

  typescript-integration:
    name: TypeScript SDK Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test-target: [typescript_basic, typescript_auth, typescript_free]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-07-13

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "rust-dev"
          save-if: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: target/debug/

      - name: Make binaries executable
        run: chmod +x target/debug/kora

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
        with:
          version: 11.13.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('sdks/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install TypeScript dependencies
        working-directory: sdks/ts
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript integration tests
        env:
          KORA_TEST_VERBOSE: "1"
        run: cargo test -p tests --test ${{ matrix.test-target }}

      - name: Cleanup test environment
        if: always()
        uses: ./.github/actions/cleanup-test-env
