name: Fork External Live Tests (manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Fork PR number to validate with external live tests"
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Resolve Fork PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      merge_ref: ${{ steps.pr.outputs.merge_ref }}
    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed("pr_number must be a positive integer.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (!pr.head.repo) {
              core.setFailed(`PR #${prNumber} fork repository no longer exists.`);
              return;
            }

            if (!pr.head.repo.fork) {
              core.setFailed(
                `PR #${prNumber} is not a fork PR. Use the normal CI workflows for internal branches.`
              );
              return;
            }

            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("merge_ref", `refs/pull/${pr.number}/merge`);

  external-live:
    name: Run Fork External Live Tests
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: external-live-tests
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.merge_ref }}
          fetch-depth: 2
          persist-credentials: false

      - name: Ensure merge ref contains the approved PR head
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          merged_head="$(git rev-parse HEAD^2)"
          if [ "${merged_head}" != "${HEAD_SHA}" ]; then
            echo "Merge ref head ${merged_head} does not match resolved PR head ${HEAD_SHA}." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-07-13

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "rust-dev"
          save-if: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.50.0"

      - name: Build workspace
        run: just build

      - name: Run external live tests
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          if [ -z "${JUPITER_API_KEY}" ]; then
            echo "JUPITER_API_KEY is required for fork external live tests." >&2
            exit 1
          fi
          cargo test -p tests --test external

      - name: Kill a Kora node that outlived its test binary
        if: always()
        run: pkill -f "kora" 2>/dev/null || true

  record:
    name: Record Fork Live Approval
    needs: [resolve, external-live]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: read
    steps:
      - name: Verify PR head is unchanged
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });

            if (pr.head.sha !== process.env.HEAD_SHA) {
              core.setFailed(
                `PR head changed during manual validation. tested=${process.env.HEAD_SHA}, current=${pr.head.sha}.`
              );
            }

      - name: Record fork live approval marker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            const marker = `fork-external-live-pass:${process.env.HEAD_SHA}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `✅ Fork external live tests passed.\n\n${marker}\nrun: ${runUrl}`,
            });

      - name: Rerun fork live gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "fork-live-gate.yml",
              event: "pull_request",
              head_sha: headSha,
              per_page: 20,
            });

            const gateRun = runs.data.workflow_runs.find((run) => run.status === "completed");
            if (!gateRun) {
              core.warning(
                `No completed fork-live-gate workflow run found for ${headSha}. ` +
                  "Re-run the gate workflow manually if required."
              );
              return;
            }

            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: gateRun.id,
            });
