name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Fuzz smoke (60s)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-13
      - uses: taiki-e/install-action@v2.82.0
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Smoke each target
        run: |
          for target in parse_transaction decode_b64_transaction; do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" -- -max_total_time=60
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  deep:
    name: Fuzz deep run (10m)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [parse_transaction, decode_b64_transaction]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-13
      - uses: taiki-e/install-action@v2.82.0
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Upload corpus and crashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/corpus/${{ matrix.target }}/
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
